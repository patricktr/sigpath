name: CI

# This repo has no Vercel build to check Dependabot's monthly patches, so this
# job is their gate: dependabot-merge.yml merges a Dependabot PR once it passes.
# It runs on pull requests only; pushes to main don't run it.

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
